<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>{{TITLE}}</title>
<style>
/*{{FONT}}*/
:root{
  --bg:#000;
  --fg:#EDE8E3;
  --mute:#9A938C;
  --dim:#5F5953;
  --line:#1F1D1B;
  --grid:#2A2725;
  --track:#141312;
  --accent:#C5AC98;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/1.45 "VBL","VBC",system-ui,"Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3{margin:0;font-weight:500}
.lb:empty{display:inline-block;min-width:1.5em}
.st{margin-left:1px;font-size:.85em;line-height:0;font-weight:400;color:var(--mute)}
.note{margin:30px 0 0;font-size:11.5px;line-height:1.6;color:var(--dim)}
.nm,.sn>a{position:relative}
.nm .lo,.sn .lo{position:absolute;right:calc(100% + 4px);top:50%;transform:translateY(-50%);width:15px;height:15px;background-size:12px;border-radius:3px}
.sn>a{margin-left:1px}
.audit-tail{font:inherit;white-space:nowrap;position:relative}
.audit-mark{display:inline-block;font-size:.8em;line-height:1;color:var(--mute);cursor:help;position:absolute;left:100%;top:-.3em;padding:0 2px;white-space:nowrap}
.vn .audit-mark{position:static}
.mark-tip{position:fixed;z-index:100;max-width:min(340px,calc(100vw - 24px));padding:12px 14px;border:1px solid var(--grid);border-radius:6px;background:#201D1A;color:var(--fg);font-size:12px;line-height:1.65;box-shadow:0 4px 20px #0008;pointer-events:none}
.note .st{margin:0 3px 0 0;color:inherit}
.rl{color:inherit;text-decoration:none}.rl:hover{text-decoration:underline}

/* 顶栏 */
.top{position:sticky;top:0;z-index:10;height:58px;display:flex;align-items:center;gap:36px;padding:0 28px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.mark{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.top nav{display:flex;gap:24px;align-self:stretch;padding-left:36px;border-left:1px solid var(--line)}
.top nav a{display:flex;align-items:center;color:var(--mute);text-decoration:none;font-size:14px;border-bottom:2px solid transparent}
.top nav a:hover{color:var(--fg);border-bottom-color:var(--accent)}
.top .lang{margin-left:auto;color:var(--mute);text-decoration:none;font-size:13px}.top .lang:hover{color:var(--fg)}

/* 主体 + 侧栏 */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 256px}
main{min-width:0;padding:0 28px 60px}
.side{border-left:1px solid var(--line)}
.side-in{position:sticky;top:58px;padding:24px 20px}
.side-toggle{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{font-size:16px}
.sh h2 b,.side-toggle b{margin-left:8px;font-weight:400;color:var(--dim);font-size:13px}
.reset{color:var(--mute);display:flex;padding:4px}
.reset:hover{color:var(--fg)}
.side ul{list-style:none;margin:0;padding:0}
.side li{display:flex;align-items:center;gap:8px}
.mn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;color:var(--fg);text-decoration:none}
.mn span{line-height:1.3}
a.mn:hover span{color:#fff;text-decoration:underline}
.mt{flex:none;display:flex;padding:10px 4px 10px 14px}
.mt i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1.5px solid var(--c)}
.mt.off i{background:transparent}
.side li:has(.off) .mn{color:var(--dim)}
.side li:has(.off) .lo{opacity:.35}

/* 厂商 logo：深色小底块，只有有文件的 key 才显示 */
.lo{display:none;flex:none;width:20px;height:20px;border-radius:5px;background:#1E1C1A center/15px no-repeat;
  box-shadow:inset 0 0 0 1px #2E2B28}
.lo[data-v="alibaba"],.lo[data-v="minimax"]{background-color:#EDE8E3}

/* 面板 */
.panel{padding:30px 0 34px;border-top:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 20px;margin-bottom:20px}
.ph h2,.card h2{font-size:17px;letter-spacing:-.01em}
.pane:not(.on){display:none}
.tabs{display:flex;flex-wrap:wrap;gap:4px 22px}
.tab{padding:6px 0 7px;font-size:14.5px;color:var(--mute);border-bottom:2px solid transparent}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs.sub{gap:2px 16px;margin:14px 0 22px}
.tab.sm{font-size:12.5px;padding:3px 0 4px}
#speed>.tabs{padding-bottom:2px;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:22px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg);cursor:pointer}
.chk input{appearance:none;width:13px;height:13px;margin:0;border:1px solid var(--mute);border-radius:2px;display:grid;place-content:center}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.seg{display:flex;gap:14px}
.sb{color:var(--dim);padding:3px 0;border-bottom:1px solid transparent}
.sb.on{color:var(--fg);border-bottom-color:var(--fg)}

/* 首屏：大竖柱 + 下面两张 */
.hero{margin:0 -28px;border-bottom:1px solid var(--line)}
.card.big{border-right:0;border-bottom:1px solid var(--line);padding-bottom:12px}
.vbars{--h:340px;position:relative;display:flex;gap:0 12px;padding:14px 4px 0 64px}
.vg{position:absolute;left:0;right:0;top:calc(14px + var(--h) * (1 - var(--y)));border-top:1px dashed var(--grid)}
.vb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;color:var(--fg);text-decoration:none;position:relative}
.vt{width:100%;height:var(--h);display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--grid)}
.vf{position:relative;width:min(100%,52px);height:calc(var(--w) * var(--k));background:var(--c);border-radius:3px 3px 0 0}
.vv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:600;color:var(--t);white-space:nowrap}
.vb .lo{margin:10px 0 0}
.vn{position:relative;width:100%;height:150px}
.vn span{position:absolute;right:50%;top:8px;transform-origin:100% 50%;transform:rotate(-45deg);width:9.5em;text-align:right;line-height:1.2;font-size:13px;color:var(--fg)}
a.vb:hover .vf{filter:brightness(1.15)}
a.vb:hover .vn span{color:#fff;text-decoration:underline}

.card{padding:26px 28px 24px;border-right:1px solid var(--line);min-width:0}
.card:last-child{border-right:0}
.card h2{margin-bottom:18px}
.key{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;color:var(--mute);font-size:12px}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:2px;background:var(--fg)}
.key .kc{background:#6E6A66}
.key .ko{background:var(--accent)}

/* 柱子：宽屏竖着，窄屏和 .h 横着 */
.bars{display:flex;gap:0 6px;padding-top:22px}
.b{flex:1 1 0;display:flex;flex-direction:column;min-width:0}
.tk{height:230px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--grid)}
.fl{position:relative;width:min(72%,46px);height:var(--w);min-height:1px;background:var(--c);border-radius:3px 3px 0 0}
.sg{position:absolute;left:0;right:0;bottom:0;height:var(--w);background:rgba(0,0,0,.5)}
.v{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:5px;white-space:nowrap;font-size:12px;font-weight:500;color:var(--fg)}
.nm{margin-top:9px;text-align:center;font-size:12px;line-height:1.25;color:var(--c);overflow-wrap:anywhere}
@media (min-width:1101px){.bars:not(.h) .nm .lo{position:static;transform:none;margin:0 auto 5px}}

.bars.h{display:flex;flex-direction:column;gap:4px;padding-top:0}
.bars.h .b{display:grid;padding-left:19px;grid-template-columns:216px minmax(0,1fr);align-items:center;column-gap:10px}
.bars.h .nm{order:-1;margin:0;text-align:left;font-size:12.5px}
.bars.h .tk{height:15px;display:block;padding-right:54px;border:0}
.bars.h .fl{width:var(--w);height:100%;border-radius:0 2px 2px 0}
.bars.h .sg{top:0;bottom:0;right:auto;height:auto;width:var(--w)}
.bars.h .so{position:absolute;top:0;bottom:0;right:0;width:var(--w);min-width:2px;background:var(--accent)}
.bars.h .v{left:100%;bottom:auto;top:50%;transform:translateY(-50%);margin:0 0 0 7px}

/* 散点 */
.sc{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:auto auto}
.sc.on{display:grid}
.sc-y{grid-row:1;writing-mode:vertical-rl;text-align:center;color:var(--mute);font-size:12.5px;padding-bottom:30px}
.sc-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;height:470px}
.plot{position:relative;margin:8px 0 30px 34px}
.gl{position:absolute;left:0;right:0;top:var(--y);border-top:1px dotted var(--grid)}
.yt{position:absolute;right:100%;top:var(--y);transform:translateY(-50%);margin-right:12px;font-size:11.5px;color:var(--dim)}
.xts{position:absolute;left:0;right:0;top:100%;height:0}
.xt{position:absolute;left:var(--x);top:9px;transform:translateX(-50%);font-size:11.5px;color:var(--dim);white-space:nowrap}
.sc.log .xts.lin,.sc.lin .xts.lg,.sc.log .pf.lin,.sc.lin .pf.lg{display:none}
.pf{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:none}
.sc.pareto.log .pf.lg,.sc.pareto.lin .pf.lin{display:block}
.pf polyline{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ld{position:absolute;left:var(--xg);right:0;top:var(--y);border-top:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pt{position:absolute;left:var(--xg);top:var(--y);width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--c);box-shadow:0 0 0 2.5px var(--bg);z-index:2}
.sc.lin .pt,.sc.lin .ld{left:var(--xl)}
.sc-names{position:relative;margin:8px 0 30px}
.sc-names svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.sc-names line{stroke-opacity:.45;stroke-width:1;vector-effect:non-scaling-stroke}
.sn{position:absolute;left:26px;top:var(--ly);transform:translateY(-50%);white-space:nowrap;font-size:13px;font-weight:500;color:var(--c)}
.sn i{display:none}
.sc-x{grid-column:2;text-align:center;color:var(--mute);font-size:12.5px;padding:4px 220px 0 34px}

/* 岗位 */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 40px}
.rc h3{font-size:14px;margin-bottom:12px}
.rc h3 a::after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 2px 8px;border:solid var(--mute);border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
.rc .bars.h .tk{padding-right:40px}

/* 谎报 */
.lies{display:flex;flex-direction:column}
.lr{display:grid;grid-template-columns:200px 34px minmax(0,1fr);align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr .nm{margin:0 0 0 19px;text-align:left;font-size:13.5px}
.ln{font-size:16px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border-radius:3px;font-size:12.5px;background:color-mix(in srgb,var(--c) 16%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.mk{white-space:normal;overflow-wrap:anywhere}
.chip{max-width:100%;line-height:1.5;border-left:2px solid var(--accent)}
.chip:has([data-role="QC"]){border-left-color:#22C3D6}
.chip:has([data-role="SORT"]){border-left-color:#A57CFF}
.chip:has([data-role="FIND"]){border-left-color:#34A853}

/* 每题 */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 30px}
.tb h3{font-size:14px;margin-bottom:10px}
.tr{display:grid;grid-template-columns:12px minmax(0,1fr) 38px;align-items:center;gap:10px;height:26px}
.ti{color:var(--dim);font-size:12px}
.tt{position:relative;height:12px;background:var(--track);border-radius:2px}
.tf{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c);border-radius:2px}
.tv{text-align:right;font-size:12.5px;font-weight:500}
.zr{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;line-height:1;color:var(--mute);white-space:nowrap}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 22px;margin-bottom:18px}
.card .ch h2{margin-bottom:0}
.ch .un{color:var(--dim);font-size:13px}
.tabs.sv{gap:4px 18px}

@media (max-width:1100px){
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card:not(.big){border-right:0;border-bottom:1px solid var(--line)}
  .vbars{padding-left:4px}
  .vn{height:182px}
  .vn span{width:auto;white-space:nowrap;right:auto;left:50%;top:8px;writing-mode:vertical-rl;transform-origin:50% 50%;transform:translateX(-50%) rotate(180deg);font-size:12px;line-height:1.2}
  .bars{flex-direction:column;gap:4px;padding-top:0}
  .b{display:grid;padding-left:19px;grid-template-columns:216px minmax(0,1fr);align-items:center;column-gap:10px}
  .nm{order:-1;margin:0;text-align:left;font-size:12.5px}
  .tk{height:15px;display:block;padding-right:54px;border:0}
  .fl{width:var(--w);height:100%;border-radius:0 2px 2px 0}
  .sg{top:0;bottom:0;right:auto;height:auto;width:var(--w)}
  .v{left:100%;bottom:auto;top:50%;transform:translateY(-50%);margin:0 0 0 7px}
}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{order:-1;border-left:0;border-bottom:1px solid var(--line)}
  .side-toggle{display:flex;align-items:center;width:100%;padding:12px 16px;font-size:14px}
  .side-in{display:none;position:static;padding:0 16px 14px}
  .side.open .side-in{display:block}
  .sh h2{display:none}
  .sh{justify-content:flex-end;margin:0}
  .side ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
  .top{padding:0 16px}
  main{padding:0 16px 48px}
  .hero{margin:0 -16px}
  .card{padding:24px 16px}
}
@media (max-width:720px){
  .top{gap:14px}
  .top nav{gap:14px;padding-left:14px}
  .top nav a{font-size:13px}
  .card{border-right:0;border-bottom:1px solid var(--line)}
  .vbars{--h:240px;gap:0 4px;padding-left:14px}
  .vf{width:100%;border-radius:2px 2px 0 0}
  .vv{writing-mode:vertical-rl;transform:translate(-50%,-50%) rotate(180deg);font-size:11px}
  .vb .lo{width:16px;height:16px;background-size:11px;border-radius:4px;margin-top:8px}
  .vn{height:170px}
  .vn span{font-size:11px}
  .card:last-child{border-bottom:0}
  .b,.bars.h .b{grid-template-columns:178px minmax(0,1fr)}
  .nm,.bars.h .nm{font-size:12px}
  .tk,.bars.h .tk{padding-right:48px}
  .sc-body{grid-template-columns:minmax(0,1fr);height:auto}
  .plot{height:300px;margin:8px 4px 30px 30px}
  .ld,.sc-names svg{display:none}
  .sc-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:14px 0 0}
  .sn{position:static;transform:none;display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:normal}
  .sn i{display:block;width:8px;height:8px;border-radius:50%;background:var(--c)}
  .sc{grid-template-columns:minmax(0,1fr)}
  .sc-y{writing-mode:horizontal-tb;text-align:left;padding:0 0 4px}
  .sc-x{grid-row:auto;grid-column:1;padding:0 0 0 30px}
  .sc-names{grid-row:auto}
  .rgrid,.tgrid{grid-template-columns:minmax(0,1fr)}
  .side ul{grid-template-columns:minmax(0,1fr)}
  .lr{grid-template-columns:26px minmax(0,1fr);gap:6px 10px}
  .lr .nm{grid-column:1/-1}
  .ctl{gap:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* 累计访客 */
.vc{padding:20px 28px 28px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.vc b{margin-left:8px;font-weight:500;color:var(--mute)}
@media (max-width:900px){.vc{padding:18px 16px 24px}}
/* 第一次进站的提示 */
#first{width:min(420px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--grid);border-radius:8px;background:#151311;color:var(--fg)}
#first[open]{display:flex;flex-direction:column}
#first::backdrop{background:#000c}
#first h2{flex:none;padding:24px 24px 12px;font-size:18px}
#first .fb{min-height:0;overflow-y:auto;padding:0 24px;overscroll-behavior:contain}
#first p{margin:0 0 12px;font-size:14px;line-height:1.75;color:#D6D0CA}
#first .lead{margin-bottom:14px;font-size:16px;line-height:1.6;color:var(--fg)}
#first p b{margin-right:.6em;font-weight:600;color:var(--fg)}
#first .foot{margin:16px 0 0;font-size:12px;line-height:1.6;color:var(--mute)}
#first form{flex:none;display:flex;justify-content:flex-end;padding:20px 24px}
@media (max-width:720px){#first h2{padding:20px 18px 10px}#first .fb{padding:0 18px}#first form{padding:18px}#first form button{width:100%}}
#first button{padding:9px 22px;border-radius:5px;background:var(--accent);color:#000;font-size:14px;font-weight:500}
</style>
<style id="hide"></style>

<script>
(()=>{
const first=document.getElementById('first');  // 关掉后在本地存储记下这一版（data-v），版本变了再弹；存储用不了就每次都弹
if(first){let seen=null;try{seen=localStorage.getItem('vb-first-seen')}catch(e){}
  if(seen!==first.dataset.v)first.showModal();
  first.addEventListener('close',()=>{try{localStorage.setItem('vb-first-seen',first.dataset.v)}catch(e){}})}
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const hide=document.getElementById('hide');
let active=null, pinned=false;
function closeTip(){$$('.mark-tip').forEach(t=>t.hidden=true);active=null;pinned=false}
function showTip(mark){
  const tip=document.getElementById(mark.getAttribute('aria-describedby'));
  if(!tip)return;
  $$('.mark-tip').forEach(t=>t.hidden=t!==tip);
  active=mark;
  const r=mark.getBoundingClientRect(), t=tip.getBoundingClientRect();
  tip.style.left=Math.max(12,Math.min(innerWidth-t.width-12,r.left+r.width/2-t.width/2))+'px';
  tip.style.top=Math.max(12,Math.min(innerHeight-t.height-12,r.bottom+t.height+8>innerHeight?r.top-t.height-8:r.bottom+8))+'px';
}
document.addEventListener('pointerover',e=>{const m=e.target.closest('[data-audit]');if(m&&e.pointerType!=='touch')showTip(m)});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-audit]')&&!pinned)closeTip()});
document.addEventListener('focusin',e=>{if(e.target.matches('[data-audit]'))showTip(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-audit]'))closeTip()});
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-audit]');
  if(m){e.preventDefault();e.stopPropagation();if(active===m&&pinned)closeTip();else{showTip(m);pinned=true}}
  else closeTip();
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeTip();
  if(e.target.matches('[data-audit]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showTip(e.target);pinned=true}
});
window.addEventListener('resize',closeTip);
window.addEventListener('scroll',()=>{if(active)showTip(active)},true);
function apply(){
  const off=$$('[data-toggle].off').map(b=>b.dataset.toggle);
  hide.textContent=off.length?off.map(i=>`.chart [data-m="${i}"]`).join(',')+'{display:none!important}':'';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){
    const g=t.dataset.group;
    $$(`[data-group="${g}"]`).forEach(b=>b.classList.toggle('on',b===t));
    $$(`[data-pane-group="${g}"]`).forEach(p=>p.classList.toggle('on',p.dataset.pane===t.dataset.tab));
    return;
  }
  const s=e.target.closest('[data-scale]');
  if(s){
    const sec=s.closest('section');
    $$('[data-scale]',sec).forEach(b=>b.classList.toggle('on',b===s));
    $$('.sc',sec).forEach(c=>{c.classList.toggle('lin',s.dataset.scale==='lin');c.classList.toggle('log',s.dataset.scale==='log')});
    return;
  }
  const m=e.target.closest('[data-toggle]');
  if(m){m.classList.toggle('off');apply();return}
  if(e.target.closest('[data-reset]')){$$('[data-toggle]').forEach(b=>b.classList.remove('off'));apply();return}
  const sd=e.target.closest('[data-side]');
  if(sd){sd.closest('.side').classList.toggle('open')}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-pareto]')){
    $$('.sc',e.target.closest('section')).forEach(c=>c.classList.toggle('pareto',e.target.checked));
  }
});
const vc=document.getElementById('vc');  // 累计访客：只在线上站发；挂了、被拦、超时都只是不显示
})();
</script>
</body>
</html>
